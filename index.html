    <script>
      (function() {
        try {
          var originalFetch = typeof window !== 'undefined' && window.fetch ? window.fetch.bind(window) : null;
          var activeFetch = originalFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return activeFetch;
            },
            set: function(newFetch) {
              activeFetch = newFetch;
            },
            configurable: true,
            enumerable: true,
          });
        } catch (e) {
          try {
            if (typeof Window !== 'undefined' && Window.prototype) {
              Object.defineProperty(Window.prototype, 'fetch', {
                get: function() {
                  return activeFetch;
                },
                set: function(newFetch) {
                  activeFetch = newFetch;
                },
                configurable: true,
                enumerable: true,
              });
            }
          } catch (err) {}
        }
      })();
    </script>
