name: Setup superuser and approval rules
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: setup-superuser
  cancel-in-progress: false
jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate and deploy protected approval rules
        id: rules
        continue-on-error: true
        run: node --import tsx scripts/deployFirestoreRules.ts
        env:
          FIREBASE_ADMIN_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DISASTERWATCH_61ED5 }}
      - name: Provision dedicated superuser
        id: account
        continue-on-error: true
        run: node --import tsx scripts/provisionSuperuser.ts
        env:
          FIREBASE_ADMIN_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DISASTERWATCH_61ED5 }}
          ADMIN_INITIAL_PASSWORD: ${{ secrets.ADMIN_INITIAL_PASSWORD }}
      - name: Report setup result
        if: steps.rules.outcome == 'failure' || steps.account.outcome == 'failure'
        run: |
          echo 'Setup incomplete; inspect rules/account steps. Hosting credentials may need Firebase Rules Admin and Firebase Authentication Admin.'
          exit 1
