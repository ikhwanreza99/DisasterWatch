# Production auto-deploy: push to main → build → Firebase Hosting (LIVE).
#
# Scope: Hosting plus newsArticles/newsFeeds and sourced disasters writes via Admin SDK.
# This workflow never deploys Firestore rules,
# Cloud Functions, Cloud Run, App Hosting, or the Blaze plan (Spark free tier).
#
# Auth: official Firebase Hosting GitHub action using a service-account key
# stored as a GitHub Secret (never committed). Owner setup (one time):
#   firebase init hosting:github
# …or manually create secret FIREBASE_SERVICE_ACCOUNT_DISASTERWATCH_61ED5
# (GCP service account with "Firebase Hosting Admin" on disasterwatch-61ed5).
#
# Build config: Vite inlines VITE_* at build time, so values come from
# GitHub Secrets (NOT committed files, NOT .env.local).
# NOTE: VITE_GEMINI_API_KEY is browser-exposed after build — it is NOT a
# server secret. Restrict the production key to Generative Language API
# only + appropriate HTTP referrers. Never log or print its value.
name: Deploy to Firebase Hosting (production)

on:
  push:
    branches: [main]
  # Refresh the Darwin VAAC volcanic-ash snapshot (public/data/vaac.json) ~every 30 min.
  # Scheduled runs always use the default branch (main). GitHub may delay cron runs.
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
    inputs:
      check_serpapi:
        description: 'Uji SerpApi Google News sekali (tanpa menjalankan seluruh crawler)'
        type: boolean
        default: false
      check_google_search:
        description: 'Uji Google Search sekali (memakai kuota; tidak menjalankan seluruh crawler)'
        type: boolean
        default: false

permissions:
  contents: read
  checks: write

# Never run two deploys at once; a newer run replaces a queued older one.
concurrency:
  group: deploy-hosting-live
  cancel-in-progress: false

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Snapshot Indonesian river flood forecasts
        run: npx tsx scripts/fetchFloodSnapshot.ts
        env:
          GOOGLE_FLOOD_API_KEY: ${{ secrets.GOOGLE_FLOOD_API_KEY }}

      # BOM blocks browser requests, so fetch server-side and ship it as a static file.
      # Non-fatal: if BOM is down the site still deploys (ABU layer shows N/A).
      - name: Snapshot Darwin VAAC volcanic ash advisories
        run: npx tsx scripts/fetchVaacSnapshot.ts public/data/vaac.json || echo "::warning::VAAC snapshot failed; deploying without it"

      - name: Restore last Google News snapshot
        uses: actions/cache/restore@v4
        with:
          path: public/data/disaster-news.json
          key: disaster-news-v2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: disaster-news-v2-

      - name: Snapshot Indonesian disaster news
        run: npx tsx scripts/fetchDisasterNews.ts
        env:
          ZAPI_API_KEY: ${{ secrets.ZAPI_API_KEY }}

      - name: Snapshot BNPB regional allocation scenario
        continue-on-error: true
        run: npx tsx scripts/fetchBnpbRegional.ts

      - name: Extract Padang article narratives
        continue-on-error: true
        run: npx tsx scripts/fetchIncidentNarratives.ts
        env:
          FIREBASE_NEWS_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_NEWS_SERVICE_ACCOUNT }}

      - name: Cache Google News snapshot
        uses: actions/cache/save@v4
        with:
          path: public/data/disaster-news.json
          key: disaster-news-v2-${{ github.run_id }}-${{ github.run_attempt }}

      # Temporarily paused until Firestore IAM access is configured.
      - name: Sync news metadata to Firestore
        if: ${{ false }}
        run: npx tsx scripts/syncDisasterNews.ts
        env:
          FIREBASE_NEWS_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_NEWS_SERVICE_ACCOUNT || secrets.FIREBASE_SERVICE_ACCOUNT_DISASTERWATCH_61ED5 }}

      - name: Restore previous Google service diagnostics
        uses: actions/cache/restore@v4
        with:
          path: public/data/google-status.json
          key: google-status-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: google-status-v1-

      - name: Snapshot Google service diagnostics (no secrets in output)
        run: npx tsx scripts/status/googleStatusSnapshot.ts
        env:
          CHECK_GOOGLE_SEARCH: ${{ inputs.check_google_search || 'false' }}
          CHECK_SERPAPI: ${{ inputs.check_serpapi || 'false' }}
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          DISASTERWATCH_GOOGLE_SEARCH_ENABLED: ${{ vars.DISASTERWATCH_GOOGLE_SEARCH_ENABLED }}
          DISASTERWATCH_GOOGLE_SEARCH_MODEL: ${{ vars.DISASTERWATCH_GOOGLE_SEARCH_MODEL }}
          DISASTERWATCH_GEMINI_SEARCH_KEY: ${{ secrets.DISASTERWATCH_GEMINI_SEARCH_KEY }}
          FIREBASE_NEWS_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_NEWS_SERVICE_ACCOUNT || secrets.FIREBASE_SERVICE_ACCOUNT_DISASTERWATCH_61ED5 }}

      - name: Sync source-backed REAL disaster records
        # Photo URL metadata only; no remote images are copied into hosting.
        run: |
          node --import tsx scripts/snapshotDisasterPhotos.ts
          node --import tsx scripts/syncRealDisasters.ts
          node --import tsx scripts/syncAdminProfile.ts
        env:
          BNPB_DRIVE_API_KEY: ${{ secrets.BNPB_DRIVE_API_KEY }}
          FIREBASE_NEWS_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_NEWS_SERVICE_ACCOUNT || secrets.FIREBASE_SERVICE_ACCOUNT_DISASTERWATCH_61ED5 }}

      - name: Preserve Google service diagnostics
        uses: actions/cache/save@v4
        with:
          path: public/data/google-status.json
          key: google-status-v1-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Build (Vite production)
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
          VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY }}
          VITE_FIREBASE_APPCHECK_SITE_KEY: ${{ secrets.VITE_FIREBASE_APPCHECK_SITE_KEY }}
          VITE_GEMINI_MODEL: ${{ secrets.VITE_GEMINI_MODEL }}
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
          # Browser-exposed (static Hosting has no proxy). Free, read-only NASA FIRMS key.
          VITE_NASA_FIRMS_MAP_KEY: ${{ secrets.VITE_NASA_FIRMS_MAP_KEY }}

      - name: Deploy Hosting only (live channel)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DISASTERWATCH_61ED5 }}
          channelId: live
          projectId: disasterwatch-61ed5
