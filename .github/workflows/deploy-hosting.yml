# Production auto-deploy: push to main → build → Firebase Hosting (LIVE).
#
# Scope: Hosting plus newsArticles/newsFeeds metadata writes via Admin SDK.
# This workflow never deploys Firestore rules,
# Cloud Functions, Cloud Run, App Hosting, or the Blaze plan (Spark free tier).
#
# Auth: official Firebase Hosting GitHub action using a service-account key
# stored as a GitHub Secret (never committed). Owner setup (one time):
#   firebase init hosting:github
# …or manually create secret FIREBASE_SERVICE_ACCOUNT_DISASTERWATCH_61ED5
# (GCP service account with "Firebase Hosting Admin" on disasterwatch-61ed5).
#
# Build config: Vite inlines VITE_* at build time, so values come from
# GitHub Secrets (NOT committed files, NOT .env.local).
# NOTE: VITE_GEMINI_API_KEY is browser-exposed after build — it is NOT a
# server secret. Restrict the production key to Generative Language API
# only + appropriate HTTP referrers. Never log or print its value.
name: Deploy to Firebase Hosting (production)

on:
  push:
    branches: [main]
  # Refresh the Darwin VAAC volcanic-ash snapshot (public/data/vaac.json) ~every 30 min.
  # Scheduled runs always use the default branch (main). GitHub may delay cron runs.
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  checks: write

# Never run two deploys at once; a newer run replaces a queued older one.
concurrency:
  group: deploy-hosting-live
  cancel-in-progress: false

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # BOM blocks browser requests, so fetch server-side and ship it as a static file.
      # Non-fatal: if BOM is down the site still deploys (ABU layer shows N/A).
      - name: Snapshot Darwin VAAC volcanic ash advisories
        run: npx tsx scripts/fetchVaacSnapshot.ts public/data/vaac.json || echo "::warning::VAAC snapshot failed; deploying without it"

      - name: Restore last Google News snapshot
        uses: actions/cache/restore@v4
        with:
          path: public/data/disaster-news.json
          key: disaster-news-v2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: disaster-news-v2-

      - name: Snapshot Indonesian disaster news
        run: npx tsx scripts/fetchDisasterNews.ts
        env:
          ZAPI_API_KEY: ${{ secrets.ZAPI_API_KEY }}

      - name: Cache Google News snapshot
        uses: actions/cache/save@v4
        with:
          path: public/data/disaster-news.json
          key: disaster-news-v2-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Sync news metadata to Firestore
        run: npx tsx scripts/syncDisasterNews.ts
        env:
          FIREBASE_NEWS_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_NEWS_SERVICE_ACCOUNT || secrets.FIREBASE_SERVICE_ACCOUNT_DISASTERWATCH_61ED5 }}

      - name: Build (Vite production)
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
          VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY }}
          VITE_GEMINI_MODEL: ${{ secrets.VITE_GEMINI_MODEL }}
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
          # Browser-exposed (static Hosting has no proxy). Free, read-only NASA FIRMS key.
          VITE_NASA_FIRMS_MAP_KEY: ${{ secrets.VITE_NASA_FIRMS_MAP_KEY }}

      - name: Deploy Hosting only (live channel)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DISASTERWATCH_61ED5 }}
          channelId: live
          projectId: disasterwatch-61ed5
