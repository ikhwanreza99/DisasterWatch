# Production auto-deploy: push to main → build → API to Cloud Run → Firebase Hosting (LIVE).
#
# Scope: Cloud Run (server-side API proxies) + Hosting plus newsArticles/newsFeeds
# and sourced disasters writes via Admin SDK.
# This workflow never deploys Firestore rules, Cloud Functions, or the Blaze plan.
#
# Auth: official Firebase Hosting GitHub action using a service-account key
# stored as a GitHub Secret (never committed). Owner setup (one time):
#   firebase init hosting:github
# …or manually create secret FIREBASE_SERVICE_ACCOUNT_DISASTERWATCH_61ED5
# (GCP service account with "Firebase Hosting Admin" on disasterwatch-61ed5).
#
# Build config: Vite inlines VITE_* at build time, so values come from
# GitHub Secrets (NOT committed files, NOT .env.local).
# NOTE: every VITE_* value is browser-exposed after build. The Gemini Developer
# API key is NOT injected here anymore — it is served only by the server-side
# proxy (server/aiProxy.ts, POST /api/ai/generate). Without a backend the direct
# Gemini fallback is unavailable and Firebase AI Logic (primary) is used.
# Never log or print any secret value.
name: Deploy to Firebase Hosting (production)

on:
  push:
    branches: [main]
  # Refresh the Darwin VAAC volcanic-ash snapshot (public/data/vaac.json) ~every 30 min.
  # Scheduled runs always use the default branch (main). GitHub may delay cron runs.
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
    inputs:
      check_serpapi:
        description: 'Uji SerpApi Google News sekali (tanpa menjalankan seluruh crawler)'
        type: boolean
        default: false
      check_google_search:
        description: 'Uji Google Search sekali (memakai kuota; tidak menjalankan seluruh crawler)'
        type: boolean
        default: false

permissions:
  contents: read
  checks: write

# Never run two deploys at once; a newer run replaces a queued older one.
concurrency:
  group: deploy-hosting-live
  cancel-in-progress: false

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Snapshot Indonesian river flood forecasts
        run: npx tsx scripts/fetchFloodSnapshot.ts
        env:
          GOOGLE_FLOOD_API_KEY: ${{ secrets.GOOGLE_FLOOD_API_KEY }}

      # BOM blocks browser requests, so fetch server-side and ship it as a static file.
      # Non-fatal: if BOM is down the site still deploys (ABU layer shows N/A).
      - name: Snapshot Darwin VAAC volcanic ash advisories
        run: npx tsx scripts/fetchVaacSnapshot.ts public/data/vaac.json || echo "::warning::VAAC snapshot failed; deploying without it"

      - name: Restore last Google News snapshot
        uses: actions/cache/restore@v4
        with:
          path: public/data/disaster-news.json
          key: disaster-news-v2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: disaster-news-v2-

      - name: Snapshot Indonesian disaster news
        run: npx tsx scripts/fetchDisasterNews.ts
        env:
          ZAPI_API_KEY: ${{ secrets.ZAPI_API_KEY }}

      - name: Snapshot BNPB regional allocation scenario
        continue-on-error: true
        run: npx tsx scripts/fetchBnpbRegional.ts

      - name: Extract Padang article narratives
        continue-on-error: true
        run: npx tsx scripts/fetchIncidentNarratives.ts
        env:
          FIREBASE_NEWS_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_NEWS_SERVICE_ACCOUNT }}

      - name: Cache Google News snapshot
        uses: actions/cache/save@v4
        with:
          path: public/data/disaster-news.json
          key: disaster-news-v2-${{ github.run_id }}-${{ github.run_attempt }}

      # Temporarily paused until Firestore IAM access is configured.
      - name: Sync news metadata to Firestore
        if: ${{ false }}
        run: npx tsx scripts/syncDisasterNews.ts
        env:
          FIREBASE_NEWS_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_NEWS_SERVICE_ACCOUNT || secrets.FIREBASE_SERVICE_ACCOUNT_DISASTERWATCH_61ED5 }}

      - name: Restore previous Google service diagnostics
        uses: actions/cache/restore@v4
        with:
          path: public/data/google-status.json
          key: google-status-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: google-status-v1-

      - name: Snapshot Google service diagnostics (no secrets in output)
        run: npx tsx scripts/status/googleStatusSnapshot.ts
        env:
          CHECK_GOOGLE_SEARCH: ${{ inputs.check_google_search || 'false' }}
          CHECK_SERPAPI: ${{ inputs.check_serpapi || 'false' }}
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          DISASTERWATCH_GOOGLE_SEARCH_ENABLED: ${{ vars.DISASTERWATCH_GOOGLE_SEARCH_ENABLED }}
          DISASTERWATCH_GOOGLE_SEARCH_MODEL: ${{ vars.DISASTERWATCH_GOOGLE_SEARCH_MODEL }}
          DISASTERWATCH_GEMINI_SEARCH_KEY: ${{ secrets.DISASTERWATCH_GEMINI_SEARCH_KEY }}
          FIREBASE_NEWS_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_NEWS_SERVICE_ACCOUNT || secrets.FIREBASE_SERVICE_ACCOUNT_DISASTERWATCH_61ED5 }}

      - name: Sync source-backed REAL disaster records
        # Photo URL metadata only; no remote images are copied into hosting.
        run: |
          node --import tsx scripts/snapshotDisasterPhotos.ts
          node --import tsx scripts/syncRealDisasters.ts
          node --import tsx scripts/syncAdminProfile.ts
        env:
          BNPB_DRIVE_API_KEY: ${{ secrets.BNPB_DRIVE_API_KEY }}
          FIREBASE_NEWS_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_NEWS_SERVICE_ACCOUNT || secrets.FIREBASE_SERVICE_ACCOUNT_DISASTERWATCH_61ED5 }}

      - name: Preserve Google service diagnostics
        uses: actions/cache/save@v4
        with:
          path: public/data/google-status.json
          key: google-status-v1-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Snapshot FIRMS without exposing the backend key
        continue-on-error: true
        run: node --import tsx scripts/fetchFirmsSnapshot.ts
        env:
          NASA_FIRMS_MAP_KEY: ${{ secrets.NASA_FIRMS_MAP_KEY || secrets.VITE_NASA_FIRMS_MAP_KEY }}

      - name: Build (Vite production)
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
          VITE_FIREBASE_APPCHECK_SITE_KEY: ${{ secrets.VITE_FIREBASE_APPCHECK_SITE_KEY }}
          VITE_GEMINI_MODEL: ${{ secrets.VITE_GEMINI_MODEL }}
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}

      - name: Guard — no server-only secret in the published bundle
        run: npm run check:bundle-secrets
        env:
          NASA_FIRMS_MAP_KEY: ${{ secrets.NASA_FIRMS_MAP_KEY || secrets.VITE_NASA_FIRMS_MAP_KEY }}
          DISASTERWATCH_GEMINI_SEARCH_KEY: ${{ secrets.DISASTERWATCH_GEMINI_SEARCH_KEY }}
          VITE_GEMINI_DIRECT_API_KEY: ${{ secrets.VITE_GEMINI_DIRECT_API_KEY }}
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          BNPB_DRIVE_API_KEY: ${{ secrets.BNPB_DRIVE_API_KEY }}
          FIREBASE_NEWS_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_NEWS_SERVICE_ACCOUNT }}

      # ---------------------------------------------------------------------
      # Cloud Run API proxy — every step below is BEST EFFORT (continue-on-error)
      # so an unconfigured project can never block the critical Hosting deploy.
      # Once the project grants the required IAM, the next push deploys Cloud Run
      # automatically and the /api/** rewrite is enabled on its own.
      # NOTE: --set-env-vars uses "^@^" as its delimiter because ALLOWED_ORIGINS
      # contains commas, which gcloud would otherwise read as pair separators.
      # ---------------------------------------------------------------------
      - name: Authenticate to Google Cloud (best effort)
        continue-on-error: true
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DISASTERWATCH_61ED5 }}

      - name: Set up Cloud SDK (best effort)
        continue-on-error: true
        uses: google-github-actions/setup-gcloud@v2

      # Creates/refreshes the Secret Manager secrets from repo secrets when the
      # repo owner has added them; otherwise it skips with a notice.
      - name: Ensure Secret Manager secrets (best effort)
        continue-on-error: true
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
          FIRMS_KEY: ${{ secrets.NASA_FIRMS_MAP_KEY || secrets.VITE_NASA_FIRMS_MAP_KEY }}
        run: |
          upsert() {
            name="$1"; value="$2"
            if [ -z "$value" ]; then echo "skip $name (repo secret not set)"; return 0; fi
            if gcloud secrets describe "$name" --project disasterwatch-61ed5 >/dev/null 2>&1; then
              printf '%s' "$value" | gcloud secrets versions add "$name" --project disasterwatch-61ed5 --data-file=- >/dev/null && echo "updated $name"
            else
              printf '%s' "$value" | gcloud secrets create "$name" --project disasterwatch-61ed5 --data-file=- >/dev/null && echo "created $name"
            fi
          }
          upsert gemini-key "$GEMINI_KEY"
          upsert firms-key "$FIRMS_KEY"

      - name: Deploy API proxy to Cloud Run (best effort)
        continue-on-error: true
        run: |
          gcloud run deploy disasterwatch-api \
            --project disasterwatch-61ed5 \
            --source . \
            --region asia-southeast2 \
            --allow-unauthenticated \
            --port 8080 \
            --set-env-vars "^@^ENABLE_ADMIN_API=false@ALLOWED_ORIGINS=https://disasterwatch-61ed5.web.app,https://disasterwatch-61ed5.firebaseapp.com" \
            --set-secrets "GEMINI_API_KEY=gemini-key:latest,NASA_FIRMS_MAP_KEY=firms-key:latest" \
            --min-instances 0 --max-instances 2 \
            --quiet

      # firebase.json routes /api/** to Cloud Run. Keep that rewrite ONLY when the
      # service actually exists, so a missing service can never break the deploy.
      # Without it the app still works: Firebase AI Logic (primary) + FIRMS snapshot.
      - name: Route /api/** to Cloud Run only when it is live
        run: |
          if gcloud run services describe disasterwatch-api --project disasterwatch-61ed5 --region asia-southeast2 >/dev/null 2>&1; then
            echo "Cloud Run service is live — keeping the /api/** rewrite."
          else
            echo "::warning::Cloud Run service not available yet — deploying without the /api/** rewrite."
            node -e 'const fs=require("fs");const c=JSON.parse(fs.readFileSync("firebase.json","utf8"));const h=Array.isArray(c.hosting)?c.hosting:[c.hosting];for(const t of h){if(t&&Array.isArray(t.rewrites))t.rewrites=t.rewrites.filter(r=>!r.run);}fs.writeFileSync("firebase.json",JSON.stringify(c,null,2)+"\n");'
          fi

      - name: Deploy Hosting only (live channel)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DISASTERWATCH_61ED5 }}
          channelId: live
          projectId: disasterwatch-61ed5
