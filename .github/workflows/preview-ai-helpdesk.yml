name: Preview AI Helpdesk

on:
  push:
    branches: [fizri/AIHelpdesk]

permissions:
  contents: read

concurrency:
  group: preview-ai-helpdesk
  cancel-in-progress: true

jobs:
  preview:
    if: github.repository == 'ikhwanreza99/DisasterWatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
      VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
      VITE_FIREBASE_APPCHECK_SITE_KEY: ${{ secrets.VITE_FIREBASE_APPCHECK_SITE_KEY }}
      VITE_GEMINI_MODEL: ${{ secrets.VITE_GEMINI_MODEL }}
      VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify Firebase web configuration exists
        run: |
          node --input-type=module <<'JS'
          for (const key of ['VITE_FIREBASE_API_KEY', 'VITE_FIREBASE_AUTH_DOMAIN', 'VITE_FIREBASE_PROJECT_ID', 'VITE_FIREBASE_APP_ID']) {
            if (!process.env[key]?.trim()) throw new Error(`Missing repository secret: ${key}`);
          }
          JS
      - run: npm run lint
      - name: Test AI Helpdesk
        run: node --import tsx --test tests/helpdeskFreeText.test.ts tests/helpdeskAnswers.test.ts tests/helpdeskReport.test.ts tests/reportIntent.test.ts tests/nttCase.test.ts
      - run: npm run build
      - name: Check public bundle
        run: node --import tsx scripts/checkBundleSecrets.ts
      - name: Prepare Hosting preview configuration
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const config = JSON.parse(fs.readFileSync('firebase.json', 'utf8'));
          // This preview uses Firebase AI Logic. Do not require the unavailable Cloud Run service.
          const hosting = { ...config.hosting, public: 'dist' };
          hosting.rewrites = hosting.rewrites.filter(rule => !rule.run);
          fs.mkdirSync('.firebase-preview', { recursive: true });
          fs.writeFileSync('.firebase-preview/firebase.json', JSON.stringify({ hosting }, null, 2));
          fs.cpSync('dist', '.firebase-preview/dist', { recursive: true });
          JS
      - name: Deploy AI Helpdesk preview
        id: hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DISASTERWATCH_61ED5 }}
          projectId: disasterwatch-61ed5
          channelId: ai-helpdesk
          expires: 7d
          entryPoint: .firebase-preview
      - name: Publish preview link in run summary
        env:
          PREVIEW_URL: ${{ steps.hosting.outputs.details_url }}
        run: |
          echo '### AI Helpdesk preview' >> "$GITHUB_STEP_SUMMARY"
          echo "$PREVIEW_URL" >> "$GITHUB_STEP_SUMMARY"
          echo 'Uses the existing Firebase project. Verify Google login and Gemini on /status before testing chat.' >> "$GITHUB_STEP_SUMMARY"
